<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン · paper-summarizer</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
<form method="post" action="/login" class="login card">
  <h1>論文要約</h1>
  <p class="muted">DGX Spark ローカル要約システム</p>
  {% if error %}<p class="error">ユーザー名またはパスワードが違います</p>{% endif %}
  <label>ユーザー名<input name="username" autocomplete="username" required autofocus></label>
  <label>パスワード<input name="password" type="password" autocomplete="current-password" required></label>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <button class="primary">ログイン</button>
</form>
</body>
</html>
